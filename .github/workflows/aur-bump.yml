name: AUR bump

# Re-vendors every AUR PKGBUILD and opens a PR with the result. The mechanical
# half of the audit in aur/README.md runs here as a hard gate; the judgement
# half is left to the review on the PR.
#
# 03:00 UTC starts a chain that must finish before 07:00 Norwegian time: vet,
# merge, image rebuild, then the host's hourly `box pull-all`. In CEST that
# deadline is 05:00 UTC, so the rebuild has to be done by ~04:00 for the hourly
# pull to catch it. Note this shares its slot with build.yml's nightly cron;
# they serialize on the `build-images` concurrency group, so a nightly build
# still running when this PR merges delays the merge's build behind it.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      rewind:
        description: >-
          Testing only. A vendored pkgbase (e.g. claude-code) to roll back to its
          previous committed state before vendoring, so the run produces a real
          bump and exercises the gates and the report on a day when nothing
          moved. Never opens a PR: rewinding and re-vendoring is net-zero
          against main, so the PR would be empty.
        required: false
        default: ""
      dry_run:
        description: >-
          Testing only. Run every check and publish the report to the job
          summary, but do not commit, push, or open a PR.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Never let two bumps race for the same branch name.
concurrency:
  group: aur-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Manufacturing a real bump is the only way to exercise the interesting
      # paths on a day when every vendored package is already current. Rolls one
      # package back to its previous committed state, including its manifest row
      # -- rewinding the whole manifest would leave every *other* package's
      # pinned commit disagreeing with its vendored copy, failing gate 2 for a
      # reason that has nothing to do with the test.
      - name: Rewind one package (manual test runs only)
        if: inputs.rewind != ''
        run: |
          set -euo pipefail
          pkg="${{ inputs.rewind }}"
          [[ -d "aur/$pkg" ]] || { echo "no such vendored package: aur/$pkg"; exit 1; }
          prev="$(git log -n 1 --skip 1 --format=%H -- "aur/$pkg/PKGBUILD")"
          [[ -n "$prev" ]] || { echo "no earlier commit touches aur/$pkg/PKGBUILD"; exit 1; }
          echo "Rewinding aur/$pkg to its state at $prev"
          git checkout "$prev" -- "aur/$pkg/"
          old_row="$(git show "$prev:aur/manifest.tsv" | grep -P "^${pkg}\t" || true)"
          if [[ -n "$old_row" ]]; then
            tmpf="$(mktemp)"
            grep -vP "^${pkg}\t" aur/manifest.tsv > "$tmpf"
            printf '%s\n' "$old_row" >> "$tmpf"
            sort "$tmpf" > aur/manifest.tsv
          fi
          # The rewind must be COMMITTED, not just staged. Everything downstream
          # diffs against HEAD, and re-vendoring restores current upstream -- so
          # with the rewind uncommitted the tree would come back identical to
          # HEAD and the run would report no changes at all.
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -qam "test: rewind $pkg to $prev"
          echo "HEAD now at $(grep -m1 '^pkgver=' "aur/$pkg/PKGBUILD")"

      - name: Re-vendor all AUR PKGBUILDs
        run: bash scripts/vendor-aur.sh --all

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          # Stage first so added/removed files show up uniformly alongside edits.
          git add -A aur/
          if git diff --cached --quiet -- aur/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All vendored PKGBUILDs are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --name-only -- aur/
          fi

      # --- Gate 1: only PKGBUILDs and the manifest may change -----------------
      # A bump that also rewrites an *.install, *.sh or *.patch is the shape a
      # poisoned package takes (aur/README.md, audit step 1).
      - name: Gate - changed files are PKGBUILDs and the manifest only
        id: gate_scope
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          unexpected="$(git diff --cached --name-only -- aur/ \
            | grep -vE '^aur/[^/]+/PKGBUILD$|^aur/manifest\.tsv$' || true)"
          if [[ -n "$unexpected" ]]; then
            {
              echo "verdict=FAIL"
              echo "detail<<EOF"
              echo "$unexpected"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::non-PKGBUILD files changed in this bump"
            printf '%s\n' "$unexpected"
          else
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          fi

      # --- Gate 2: vendored copies really are upstream at the pinned commits --
      # Catches a local copy that drifted from what manifest.tsv claims
      # (aur/README.md, audit step 4). This is the check a reviewer cannot do by
      # eye, and the one a cloud agent cannot do at all -- the AUR is not
      # reachable from an agent sandbox -- so it belongs here.
      - name: Gate - vendored copies match their pinned upstream commits
        id: gate_provenance
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; R="$PWD"; bad=()
          while IFS=$'\t' read -r base commit _; do
            [[ -n "$base" ]] || continue
            if ! git clone --quiet "https://aur.archlinux.org/$base.git" "$tmp/$base"; then
              bad+=("$base (clone failed)"); continue
            fi
            if ! git -C "$tmp/$base" checkout --quiet "$commit" 2>/dev/null; then
              bad+=("$base (pinned commit $commit not found upstream)"); continue
            fi
            rm -rf "$tmp/$base/.git"
            rm -f "$tmp/$base"/{.SRCINFO,.nvchecker.toml,.gitignore}
            if ! diff -ruN "$R/aur/$base" "$tmp/$base" >/dev/null; then
              bad+=("$base (vendored copy differs from upstream at pinned commit)")
            fi
          done < aur/manifest.tsv
          rm -rf "$tmp"
          if [[ ${#bad[@]} -gt 0 ]]; then
            {
              echo "verdict=FAIL"
              echo "detail<<EOF"
              printf '%s\n' "${bad[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::provenance check failed"
            printf '%s\n' "${bad[@]}"
          else
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          fi

      # --- Report: the residue a human (or Claude) actually has to read -------
      - name: Build audit report
        id: report
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Vendored AUR bump"
            echo
            echo "Generated by \`.github/workflows/aur-bump.yml\`. The mechanical"
            echo "checks below already ran; what needs a reader is the residual"
            echo "diff and the source hosts."
            echo
            echo "### Mechanical gates"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Only PKGBUILDs + manifest changed | ${{ steps.gate_scope.outputs.verdict }} |"
            echo "| Vendored copies match pinned upstream commits | ${{ steps.gate_provenance.outputs.verdict }} |"
            echo
            if [[ "${{ steps.gate_scope.outputs.verdict }}" == "FAIL" ]]; then
              echo "**Unexpected files changed:**"; echo
              echo '```'; echo "${{ steps.gate_scope.outputs.detail }}"; echo '```'; echo
            fi
            if [[ "${{ steps.gate_provenance.outputs.verdict }}" == "FAIL" ]]; then
              echo "**Provenance failures:**"; echo
              echo '```'; echo "${{ steps.gate_provenance.outputs.detail }}"; echo '```'; echo
            fi

            echo "### Version changes"
            echo
            echo '```'
            for p in $(git diff --cached --name-only -- 'aur/*/PKGBUILD' | cut -d/ -f2); do
              old="$(git show "HEAD:aur/$p/PKGBUILD" 2>/dev/null | grep -m1 '^pkgver=' || echo 'pkgver=(new)')"
              new="$(grep -m1 '^pkgver=' "aur/$p/PKGBUILD" || echo 'pkgver=(none)')"
              printf '%-28s %s -> %s\n' "$p" "${old#pkgver=}" "${new#pkgver=}"
            done
            echo '```'
            echo

            echo "### Residual diff (routine version/checksum lines stripped)"
            echo
            echo "Whatever appears here is the actual change in build behaviour."
            echo
            echo '```diff'
            git diff --cached -U0 -- 'aur/*/PKGBUILD' aur/manifest.tsv \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
              | grep -viE "^[+-]\s*(pkgver=|_commit=|sha[0-9]+sums|md5sums)" \
              | grep -vE "^[+-]\s*'[0-9a-f]{40,128}'?\)?$" \
              | grep -vE '^[+-][a-z0-9-]+\s+[0-9a-f]{40}\s+[0-9]{4}-' \
              || echo '(nothing but routine version/checksum/manifest lines)'
            echo '```'
            echo

            echo "### Source host comparison"
            echo
            echo "Every host must be the software vendor's own. A new host, an IP"
            echo "literal, or a shortener is stop-and-investigate."
            echo
            echo '```'
            urls() {
              grep -ohE 'https?://[^"'"'"' )]+' \
                | sed -E 's/[0-9]+\.[0-9]+[0-9.]*/VER/g; s/[0-9a-f]{40}/COMMIT/g' | sort -u
            }
            pkgs="$(git diff --cached --name-only -- 'aur/*/PKGBUILD' | cut -d/ -f2)"
            for p in $pkgs; do git show "HEAD:aur/$p/PKGBUILD" 2>/dev/null || true; done | urls > "$RUNNER_TEMP/before.txt"
            for p in $pkgs; do cat "aur/$p/PKGBUILD"; done | urls > "$RUNNER_TEMP/after.txt"
            diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" || true
            if diff -q "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" >/dev/null; then echo '(no change in source hosts)'; fi
            echo '```'
            echo

            echo "### Knock-on references"
            echo
            echo "Nothing outside \`aur/\` should hardcode a vendored version."
            echo
            echo '```'
            found=0
            for p in $pkgs; do
              old="$(git show "HEAD:aur/$p/PKGBUILD" 2>/dev/null | grep -m1 '^pkgver=' | cut -d= -f2- || true)"
              [[ -n "$old" ]] || continue
              hits="$(grep -rn --fixed-strings "$old" . \
                --exclude-dir=.git --exclude-dir=aur 2>/dev/null || true)"
              if [[ -n "$hits" ]]; then found=1; printf '%s: %s\n%s\n' "$p" "$old" "$hits"; fi
            done
            [[ $found -eq 0 ]] && echo '(none)'
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, push, and open the PR
        id: pr
        if: steps.detect.outputs.changed == 'true' && !inputs.dry_run && inputs.rewind == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="aur/bump-$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          {
            echo "aur: Upgrade"
            echo
            for p in $(git diff --cached --name-only -- 'aur/*/PKGBUILD' | cut -d/ -f2); do
              old="$(git show "HEAD:aur/$p/PKGBUILD" 2>/dev/null | grep -m1 '^pkgver=' | cut -d= -f2- || echo '(new)')"
              new="$(grep -m1 '^pkgver=' "aur/$p/PKGBUILD" | cut -d= -f2- || echo '(none)')"
              echo "$p: $old -> $new"
            done
          } > "$RUNNER_TEMP/commit.txt"
          git commit -q -F "$RUNNER_TEMP/commit.txt"
          git push -q origin "$branch"

          verdict=OK
          if [[ "${{ steps.gate_scope.outputs.verdict }}" == "FAIL" \
             || "${{ steps.gate_provenance.outputs.verdict }}" == "FAIL" ]]; then
            verdict="GATE FAILED"
          fi

          gh label create aur-bump      --color 0e8a16 --force --description "Automated AUR PKGBUILD bump" >/dev/null 2>&1 || true
          gh label create needs-review  --color d93f0b --force --description "Automated gate failed; do not merge unread" >/dev/null 2>&1 || true

          labels="aur-bump"
          [[ "$verdict" == "GATE FAILED" ]] && labels="aur-bump,needs-review"

          url="$(gh pr create \
            --title "aur: Upgrade ($verdict)" \
            --body-file "$RUNNER_TEMP/report.md" \
            --base main --head "$branch" \
            --label "$labels")"
          echo "Opened $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A failed gate must surface in the Actions UI, but only after the PR
      # exists -- the PR is what a human reads to decide what happened.
      - name: Fail the run if a gate failed
        if: >-
          steps.detect.outputs.changed == 'true' &&
          (steps.gate_scope.outputs.verdict == 'FAIL' ||
           steps.gate_provenance.outputs.verdict == 'FAIL')
        run: |
          echo "A mechanical audit gate failed; see ${{ steps.pr.outputs.url }}"
          exit 1
