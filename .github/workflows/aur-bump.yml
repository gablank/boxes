name: AUR bump

# Re-vendors every AUR PKGBUILD and opens a PR with the result.
#
# 21:28 UTC -- the evening *before* the day this lands. The aim is to finish
# before 07:00 Norwegian time: vet, merge, image rebuild, then the host's hourly
# `box pull-all`. In CEST that deadline is 05:00 UTC, so the rebuild has to be
# done by ~04:00 and this has to start by ~02:30. GitHub does not delay
# scheduled starts a little: measured 2026-09-09..09-13 it created these runs
# 4.1-5.1 hours after the cron fired, drifting worse across the week, which put
# a 03:28 cron on the runner at ~08:00 -- hours past the deadline. The delay is
# in creating the run, not in finding a runner (startedAt == createdAt on every
# one), so nothing inside this workflow can shorten it. Hence a cron set early
# enough to absorb the backlog rather than chase it. Nothing here has a "too
# soon", so a run that does fire on time is simply finished overnight.
# Minute 28 keeps it off the busy top of the hour. Image builds serialize on the
# `build-images` concurrency group, so build.yml's 21:00 UTC nightly build still
# running when this PR merges delays the merge's build behind it.
#
# STRUCTURE. Everything this workflow processes --
# PKGBUILD contents, and the *names* of the files in them -- is written by AUR
# package maintainers, i.e. by people outside this repository. The 2026-09-08
# security review found that treating that as trusted input gave arbitrary code
# execution in a job holding contents/pull-requests/statuses write, through a
# vendored filename interpolated into a `run:` script. So:
#
#   audit    handles untrusted content and holds NO write token
#            (`contents: read`, `persist-credentials: false`). It cannot push,
#            open a PR, or post a status even if it is compromised.
#   publish  applies the patch to an isolated Git index, never a checkout;
#            tier A and B candidates are open PRs, tier C ones are
#            needs-review drafts.
#   prepare  rechecks the exact PR, reclassifies it, and builds the payload its
#            tier is reviewed from -- a zero-context diff for tier A, the diff
#            plus the full text of each changed file for tier B.
#   review   runs tool-less Claude Code using subscription OAuth against the
#            policy for that tier; its process receives no GitHub credentials,
#            repository files or PR prose.
#   finish   rechecks eligibility, the tier and the bound verdict, then merges
#            or comments.
#
# Two rules keep that boundary real, and both are load-bearing:
#
#   1. NEVER write a `${{ ... }}` expression inside a `run:` block. Actions
#      substitutes those into the script *source* before bash parses it, so any
#      expression carrying untrusted text is a shell injection. Pass values
#      through `env:` and print them with `printf '%s\n' "$VAR"`, or write them
#      to a file and `cat` it. The only expressions below are in `if:`, `env:`
#      and `with:`.
#   2. Untrusted text never becomes a step *output*. Step outputs are what get
#      interpolated. Findings go to files under $RUNNER_TEMP; outputs carry only
#      fixed words this workflow chose itself (true/false/PASS/FAIL).
#
# scripts/validate-aur-diff.py is the content gate, and it fails closed. Tier A
# is the literal grammar: every changed line must match an exact literal shape,
# replacing the old "strip lines starting with pkgver=/sha256sums= and read the
# rest" filter, which reported a diff containing `pkgver=1.2.3$(...)` as routine.
# Tier B is bounded packager-authored code -- scriptlets, patches, wrappers,
# completions -- which is where an attack on a vendored recipe actually lives,
# so it is read line by line under .github/aur-review-prompt.md rather than
# merged mechanically. Tier C is everything a human must read. Its adversarial
# regression tests run in build.yml's lint job; see scripts/test-aur-validator.sh.

on:
  schedule:
    - cron: "28 21 * * *"
  workflow_dispatch:

# No ambient permissions; each job asks for exactly what it needs.
permissions: {}

# Serialize publishers; branch names also include run ID + attempt for reruns.
concurrency:
  group: aur-bump
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Untrusted half. Read-only token, no persisted credentials.
  # ---------------------------------------------------------------------------
  audit:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave a push credential in .git/config for the job that
          # handles upstream-controlled content.
          persist-credentials: false

      - name: Re-vendor all AUR PKGBUILDs
        id: vendor
        continue-on-error: true
        run: bash scripts/vendor-aur.sh --all > "$RUNNER_TEMP/vendor.txt" 2>&1

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          # Stage first so added/removed files show up uniformly alongside edits.
          git add -A aur/
          if git diff --cached --quiet -- aur/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All vendored PKGBUILDs are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # -z, then printed one per line: never word-split a filename.
            git diff --cached --name-only -z -- aur/ | tr '\0' '\n'
          fi

      - name: Report fetch failure with no candidate
        if: steps.vendor.outcome != 'success' && steps.detect.outputs.changed != 'true'
        run: |
          echo '::error::Vendoring failed before producing a candidate; no PR can be opened.'
          exit 1

      # --- Gate 1: which tier of review does this change need? -----------------
      # Paths, file modes, every changed line, and whether versions move
      # forward. See the script's docstring for the three tiers and for why
      # prefix-stripping was unsafe. This step only reports: publish
      # reclassifies the candidate itself from the isolated index.
      - name: Gate - classify the change into a review tier
        id: gate_validate
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          printf 'C' > "$RUNNER_TEMP/tier"
          python3 scripts/validate-aur-diff.py --repo . --tier-file "$RUNNER_TEMP/tier" \
            > "$RUNNER_TEMP/validate.txt" 2>&1 || true
          tier="$(cat "$RUNNER_TEMP/tier")"
          case "$tier" in A|B|C) ;; *) tier=C ;; esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          # `cat` never interprets its input as script.
          cat "$RUNNER_TEMP/validate.txt"

      # --- Gate 2: vendored copies really are upstream at the pinned commits --
      # Catches a local copy that drifted from what manifest.tsv claims
      # (aur/README.md, audit step 4). This is the check a reviewer cannot do by
      # eye, and the one a cloud agent cannot do at all -- the AUR is not
      # reachable from an agent sandbox -- so it belongs here.
      - name: Gate - vendored copies match their pinned upstream commits
        id: gate_provenance
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; R="$PWD"; bad=()
          while IFS=$'\t' read -r base commit _; do
            [[ -n "$base" ]] || continue
            # Check the row's shape before either value reaches git.
            if ! [[ "$base" =~ ^[a-z0-9][a-z0-9._+-]*$ && "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              bad+=("$base (malformed manifest row)"); continue
            fi
            if ! git clone --quiet "https://aur.archlinux.org/$base.git" "$tmp/$base"; then
              bad+=("$base (clone failed)"); continue
            fi
            if ! git -C "$tmp/$base" checkout --quiet "$commit" 2>/dev/null; then
              bad+=("$base (pinned commit $commit not found upstream)"); continue
            fi
            rm -rf "$tmp/$base/.git"
            rm -f "$tmp/$base"/{.SRCINFO,.nvchecker.toml,.gitignore}
            if ! diff -ruN "$R/aur/$base" "$tmp/$base" >/dev/null; then
              bad+=("$base (vendored copy differs from upstream at pinned commit)")
            fi
          done < aur/manifest.tsv
          rm -rf "$tmp"
          : > "$RUNNER_TEMP/provenance.txt"
          if [[ ${#bad[@]} -gt 0 ]]; then
            printf '%s\n' "${bad[@]}" > "$RUNNER_TEMP/provenance.txt"
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/provenance.txt"
          else
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          fi

      # Both accepted and rejected candidates are published as data. Reporting
      # and publication never execute or check out a candidate recipe.
      - name: Package candidate and audit findings
        if: steps.detect.outputs.changed == 'true'
        env:
          PROVENANCE_VERDICT: ${{ steps.gate_provenance.outputs.verdict }}
          VENDOR_RESULT: ${{ steps.vendor.outcome }}
        run: python3 scripts/aur-review.py bundle --output "$RUNNER_TEMP/aur-candidate"

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.changed == 'true'
        with:
          name: aur-candidate
          path: ${{ runner.temp }}/aur-candidate/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: audit
    if: >-
      needs.audit.outputs.changed == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      branch: ${{ steps.pr.outputs.branch }}
      publish_attempt: ${{ steps.pr.outputs.publish_attempt }}
      tier: ${{ steps.pr.outputs.tier }}
      eligible: ${{ steps.pr.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aur-candidate
          path: ${{ runner.temp }}/incoming
      - name: Publish candidate without checking it out
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aur-review.py publish --input "$RUNNER_TEMP/incoming"

  prepare:
    needs: publish
    if: >-
      needs.publish.outputs.eligible == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify eligibility and prepare only changed lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          BUMP_BRANCH: ${{ needs.publish.outputs.branch }}
          PUBLISH_ATTEMPT: ${{ needs.publish.outputs.publish_attempt }}
        run: python3 scripts/aur-review.py prepare --output "$RUNNER_TEMP/request.json"
      - uses: actions/upload-artifact@v4
        with:
          name: aur-review-request
          path: ${{ runner.temp }}/request.json
          retention-days: 7
          if-no-files-found: error

  review:
    needs: prepare
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aur-review
    permissions:
      contents: read
    steps:
      # Only trusted code is checked out. The Claude process runs elsewhere,
      # in an empty directory with every tool and customization disabled.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.267
      - uses: actions/download-artifact@v4
        with:
          name: aur-review-request
          path: ${{ runner.temp }}/review-input
      - name: Review diff without tools or GitHub credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/aur-review.py review --input "$RUNNER_TEMP/review-input/request.json" --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: aur-review-result
          path: ${{ runner.temp }}/result.json
          retention-days: 7
          if-no-files-found: error

  finish:
    needs: [publish, prepare, review]
    if: >-
      always() && !cancelled() &&
      needs.publish.result == 'success' && needs.publish.outputs.eligible == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aur-review-result
          path: ${{ runner.temp }}/review-result
      - name: Recheck and merge exact SHA or post findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          BUMP_BRANCH: ${{ needs.publish.outputs.branch }}
          PUBLISH_ATTEMPT: ${{ needs.publish.outputs.publish_attempt }}
        run: python3 scripts/aur-review.py finish --input "$RUNNER_TEMP/review-result/result.json"
