name: AUR bump

# Re-vendors every AUR PKGBUILD and opens a PR with the result.
#
# 03:00 UTC starts a chain that must finish before 07:00 Norwegian time: vet,
# merge, image rebuild, then the host's hourly `box pull-all`. In CEST that
# deadline is 05:00 UTC, so the rebuild has to be done by ~04:00 for the hourly
# pull to catch it. Note this shares its slot with build.yml's nightly cron;
# they serialize on the `build-images` concurrency group, so a nightly build
# still running when this PR merges delays the merge's build behind it.
#
# STRUCTURE. Everything this workflow processes --
# PKGBUILD contents, and the *names* of the files in them -- is written by AUR
# package maintainers, i.e. by people outside this repository. The 2026-09-08
# security review found that treating that as trusted input gave arbitrary code
# execution in a job holding contents/pull-requests/statuses write, through a
# vendored filename interpolated into a `run:` script. So:
#
#   audit    handles untrusted content and holds NO write token
#            (`contents: read`, `persist-credentials: false`). It cannot push,
#            open a PR, or post a status even if it is compromised.
#   publish  holds the write tokens, runs only when audit says PASS, and
#            re-validates the patch it receives rather than trusting the verdict.
#   review   holds only a read token and the environment-scoped routine token;
#            calls Claude after publish succeeds, with a validated zero-context diff
#            and fixed identifiers, without PR prose or unchanged recipe text.
#
# Two rules keep that boundary real, and both are load-bearing:
#
#   1. NEVER write a `${{ ... }}` expression inside a `run:` block. Actions
#      substitutes those into the script *source* before bash parses it, so any
#      expression carrying untrusted text is a shell injection. Pass values
#      through `env:` and print them with `printf '%s\n' "$VAR"`, or write them
#      to a file and `cat` it. The only expressions below are in `if:`, `env:`
#      and `with:`.
#   2. Untrusted text never becomes a step *output*. Step outputs are what get
#      interpolated. Findings go to files under $RUNNER_TEMP; outputs carry only
#      fixed words this workflow chose itself (true/false/PASS/FAIL).
#
# scripts/validate-aur-diff.py is the content gate, and it fails closed: every
# changed line must match an exact literal shape. It replaces the old "strip
# lines starting with pkgver=/sha256sums= and read the rest" filter, which
# reported a diff containing `pkgver=1.2.3$(...)` as routine. Its adversarial
# regression tests run in build.yml's lint job; see scripts/test-aur-validator.sh.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# No ambient permissions; each job asks for exactly what it needs.
permissions: {}

# Serialize publishers; branch names also include run ID + attempt for reruns.
concurrency:
  group: aur-bump
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Untrusted half. Read-only token, no persisted credentials.
  # ---------------------------------------------------------------------------
  audit:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave a push credential in .git/config for the job that
          # handles upstream-controlled content.
          persist-credentials: false

      - name: Re-vendor all AUR PKGBUILDs
        run: bash scripts/vendor-aur.sh --all

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          # Stage first so added/removed files show up uniformly alongside edits.
          git add -A aur/
          if git diff --cached --quiet -- aur/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All vendored PKGBUILDs are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # -z, then printed one per line: never word-split a filename.
            git diff --cached --name-only -z -- aur/ | tr '\0' '\n'
          fi

      # --- Gate 1: the change is mechanically validatable as a routine bump ---
      # Paths, file modes and every changed line. See the script's docstring for
      # why prefix-stripping was unsafe.
      - name: Gate - changes validate as a routine version bump
        id: gate_validate
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if python3 scripts/validate-aur-diff.py --repo . \
               > "$RUNNER_TEMP/validate.txt" 2>&1; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
          fi
          # `cat` never interprets its input as script.
          cat "$RUNNER_TEMP/validate.txt"

      # --- Gate 2: vendored copies really are upstream at the pinned commits --
      # Catches a local copy that drifted from what manifest.tsv claims
      # (aur/README.md, audit step 4). This is the check a reviewer cannot do by
      # eye, and the one a cloud agent cannot do at all -- the AUR is not
      # reachable from an agent sandbox -- so it belongs here.
      - name: Gate - vendored copies match their pinned upstream commits
        id: gate_provenance
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; R="$PWD"; bad=()
          while IFS=$'\t' read -r base commit _; do
            [[ -n "$base" ]] || continue
            # Check the row's shape before either value reaches git.
            if ! [[ "$base" =~ ^[a-z0-9][a-z0-9._+-]*$ && "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              bad+=("$base (malformed manifest row)"); continue
            fi
            if ! git clone --quiet "https://aur.archlinux.org/$base.git" "$tmp/$base"; then
              bad+=("$base (clone failed)"); continue
            fi
            if ! git -C "$tmp/$base" checkout --quiet "$commit" 2>/dev/null; then
              bad+=("$base (pinned commit $commit not found upstream)"); continue
            fi
            rm -rf "$tmp/$base/.git"
            rm -f "$tmp/$base"/{.SRCINFO,.nvchecker.toml,.gitignore}
            if ! diff -ruN "$R/aur/$base" "$tmp/$base" >/dev/null; then
              bad+=("$base (vendored copy differs from upstream at pinned commit)")
            fi
          done < aur/manifest.tsv
          rm -rf "$tmp"
          : > "$RUNNER_TEMP/provenance.txt"
          if [[ ${#bad[@]} -gt 0 ]]; then
            printf '%s\n' "${bad[@]}" > "$RUNNER_TEMP/provenance.txt"
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/provenance.txt"
          else
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          fi

      # Abort BEFORE the report is built. In the reviewed version the report ran
      # first, so the step that detected a hostile file was also the step that
      # executed it -- the payload fired on the failure path. Nothing downstream
      # of here ever sees input that did not validate.
      - name: Fail before reporting if a gate failed
        if: >-
          steps.detect.outputs.changed == 'true' &&
          (steps.gate_validate.outputs.verdict == 'FAIL' ||
           steps.gate_provenance.outputs.verdict == 'FAIL')
        run: |
          set -euo pipefail
          {
            echo "## AUR bump: audit gates failed -- no PR was opened"
            echo
            echo '```'
            cat "$RUNNER_TEMP/validate.txt" 2>/dev/null || true
            cat "$RUNNER_TEMP/provenance.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::a mechanical audit gate failed; no PR was opened"
          exit 1

      # Only reached when both gates passed, so this cannot report PASS for a
      # run that failed one.
      - name: Record the audit verdict
        id: verdict
        if: steps.detect.outputs.changed == 'true'
        run: echo "verdict=PASS" >> "$GITHUB_OUTPUT"

      # --- Report: what a reader still has to judge --------------------------
      # Only reached when every changed line already validated, so the loops
      # below cannot meet a hostile path. The residual-diff section is gone: the
      # PR now carries the FULL diff, because deciding which lines are "routine"
      # is exactly the judgement that was wrong.
      - name: Build audit report
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/raw-before.txt"; : > "$RUNNER_TEMP/raw-after.txt"
          {
            echo "## Vendored AUR bump"
            echo
            echo "Generated by \`.github/workflows/aur-bump.yml\`. Every changed"
            echo "line passed \`scripts/validate-aur-diff.py\`, which admits only"
            echo "literal version, checksum and manifest updates. Read the full"
            echo "diff below anyway: validation proves the change is *literal*,"
            echo "not that the new upstream release is trustworthy."
            echo
            echo "### Mechanical gates"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Changed lines validate as a routine bump | PASS |"
            echo "| Vendored copies match pinned upstream commits | PASS |"
            echo

            echo "### Version changes"
            echo
            echo '```'
            while IFS= read -r -d '' f; do
              p="${f#aur/}"; p="${p%/PKGBUILD}"
              old="$(git show "HEAD:$f" 2>/dev/null | grep -m1 '^pkgver=' || echo 'pkgver=(new)')"
              new="$(grep -m1 '^pkgver=' "$f" || echo 'pkgver=(none)')"
              printf '%-28s %s -> %s\n' "$p" "${old#pkgver=}" "${new#pkgver=}"
              git show "HEAD:$f" 2>/dev/null >> "$RUNNER_TEMP/raw-before.txt" || true
              cat "$f" >> "$RUNNER_TEMP/raw-after.txt"
            done < <(git diff --cached --name-only -z -- 'aur/*/PKGBUILD')
            echo '```'
            echo

            echo "### Full diff"
            echo
            echo '```diff'
            git diff --cached --no-ext-diff --no-textconv -- aur/
            echo '```'
            echo

            echo "### Source host comparison"
            echo
            echo "Every host must be the software vendor's own, and a permitted"
            echo "hostname is not enough: \`github.com\` and"
            echo "\`gitlab.archlinux.org\` are shared hosting, so check the exact"
            echo "repository and path too."
            echo
            echo '```'
            urls() {
              grep -ohE 'https?://[^"'"'"' )]+' \
                | sed -E 's/[0-9]+\.[0-9]+[0-9.]*/VER/g; s/[0-9a-f]{40}/COMMIT/g' | sort -u
            }
            urls < "$RUNNER_TEMP/raw-before.txt" > "$RUNNER_TEMP/before.txt" || true
            urls < "$RUNNER_TEMP/raw-after.txt"  > "$RUNNER_TEMP/after.txt"  || true
            if diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"; then
              echo '(no change in source hosts)'
            fi
            echo '```'
            echo

            echo "### Knock-on references"
            echo
            echo "Nothing outside \`aur/\` should hardcode a vendored version."
            echo
            echo '```'
            found=0
            while IFS= read -r -d '' f; do
              old="$(git show "HEAD:$f" 2>/dev/null | grep -m1 '^pkgver=' | cut -d= -f2- || true)"
              [[ -n "$old" ]] || continue
              hits="$(grep -rn --fixed-strings -- "$old" . \
                --exclude-dir=.git --exclude-dir=aur 2>/dev/null || true)"
              if [[ -n "$hits" ]]; then
                found=1
                printf '%s: %s\n%s\n' "${f#aur/}" "$old" "$hits"
              fi
            done < <(git diff --cached --name-only -z -- 'aur/*/PKGBUILD')
            [[ $found -eq 0 ]] && echo '(none)'
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --no-ext-diff --no-textconv -- aur/ > "$RUNNER_TEMP/bump.patch"

      - name: Hand the validated change to the publisher
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aur-bump
          path: |
            ${{ runner.temp }}/bump.patch
            ${{ runner.temp }}/report.md
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Trusted half. Holds the write tokens; never processes unvalidated content.
  # ---------------------------------------------------------------------------
  publish:
    needs: audit
    # Restricted to main so a workflow_dispatch from another branch cannot
    # publish, and gated on the audit job's verdict output.
    if: >-
      needs.audit.outputs.changed == 'true' &&
      needs.audit.outputs.verdict == 'PASS' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      branch: ${{ steps.pr.outputs.branch }}
      publish_attempt: ${{ steps.pr.outputs.publish_attempt }}
    permissions:
      contents: write
      pull-requests: write
      # For the aur-bump/eligible commit status below.
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aur-bump
          path: ${{ runner.temp }}/incoming

      # Trust the artifact no more than the job that produced it. A verdict is a
      # claim; this re-derives it from the patch itself, in a clean checkout,
      # without executing any of the content.
      - name: Re-validate the received change
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn "$RUNNER_TEMP/incoming/bump.patch"
          git add -A

          outside="$(git diff --cached --name-only -z | tr '\0' '\n' \
            | grep -vE '^aur/' || true)"
          if [[ -n "$outside" ]]; then
            echo "::error::patch touched paths outside aur/"
            printf '%s\n' "$outside"
            exit 1
          fi

          python3 scripts/validate-aur-diff.py --repo .

      - name: Commit, push, and open the PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="aur/bump-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          {
            echo "aur: Upgrade"
            echo
            while IFS= read -r -d '' f; do
              p="${f#aur/}"; p="${p%/PKGBUILD}"
              old="$(git show "HEAD:$f" 2>/dev/null | grep -m1 '^pkgver=' | cut -d= -f2- || echo '(new)')"
              new="$(grep -m1 '^pkgver=' "$f" | cut -d= -f2- || echo '(none)')"
              printf '%s: %s -> %s\n' "$p" "$old" "$new"
            done < <(git diff --cached --name-only -z -- 'aur/*/PKGBUILD')
          } > "$RUNNER_TEMP/commit.txt"
          git commit -q -F "$RUNNER_TEMP/commit.txt"
          git push -q origin "$branch"

          head_sha="$(git rev-parse HEAD)"

          # The reviewer must merge this exact commit. If the branch moves after
          # review, the merge has to fail rather than pick up the new tip.
          {
            cat "$RUNNER_TEMP/incoming/report.md"
            echo
            echo "### Merge binding"
            echo
            printf 'Reviewed head SHA: `%s`\n\n' "$head_sha"
            echo "Merge only this SHA. If the branch has moved since review, the"
            echo "change under review is not the change being merged -- re-review"
            echo "instead of merging."
          } > "$RUNNER_TEMP/body.md"

          gh label create aur-bump     --color 0e8a16 --force --description "Automated AUR PKGBUILD bump" >/dev/null 2>&1 || true
          gh label create needs-review --color d93f0b --force --description "Vetting found a problem; do not merge unread" >/dev/null 2>&1 || true

          url="$(gh pr create \
            --title "aur: Upgrade" \
            --body-file "$RUNNER_TEMP/body.md" \
            --base main --head "$branch" \
            --label aur-bump)"
          echo "Opened $url"
          pr_number="${url##*/}"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]

          # Proof of provenance that GitHub itself can enforce, posted on the
          # exact reviewed commit.
          #
          # WHAT THIS IS AND IS NOT. Made a required status check, GitHub refuses
          # to merge a PR lacking it -- for identities that cannot bypass the
          # rule. It is not exclusive to this workflow: any writer with statuses
          # permission can post the same context, so bind an expected
          # integration in the ruleset and audit who holds bypass rights. See
          # aur/README.md.
          gh api --method POST "repos/${REPO}/statuses/${head_sha}" \
            -f state=success \
            -f context='aur-bump/eligible' \
            -f target_url="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            -f description='Branch was created by the nightly AUR bump workflow' >/dev/null
          echo "Posted aur-bump/eligible on $head_sha"
          {
            printf 'pr_number=%s\n' "$pr_number"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'branch=%s\n' "$branch"
            printf 'publish_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Configure this environment to allow the main BRANCH only (no tags).
    # Keep the routine token here, never at repository scope. See aur/README.md.
    environment: aur-review
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate publisher metadata and trigger the review
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_REVIEW_ROUTINE_ID: ${{ vars.AUR_REVIEW_ROUTINE_ID }}
          AUR_REVIEW_ROUTINE_TOKEN: ${{ secrets.AUR_REVIEW_ROUTINE_TOKEN }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          BUMP_BRANCH: ${{ needs.publish.outputs.branch }}
          PUBLISH_ATTEMPT: ${{ needs.publish.outputs.publish_attempt }}
        run: python3 scripts/trigger-aur-review.py
