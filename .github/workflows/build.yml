name: Build box images

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Serialize runs: a push racing the nightly build must not interleave
# pushes of the latest/date tags across the two runs.
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow YAML
        run: python3 scripts/check-workflow-yaml.py

      - name: Test workflow YAML push protection
        run: python3 scripts/test-workflow-yaml.py

      - name: Compile all box.toml files
        run: |
          compiled=0
          for d in */; do
            if [[ -f "$d/box.toml" ]]; then
              python3 scripts/compile-box-toml.py "$d"
              compiled=$((compiled + 1))
            fi
          done
          if [[ $compiled -eq 0 ]]; then
            echo "ERROR: no box.toml files found"
            exit 1
          fi
          echo "OK: compiled $compiled box.toml file(s)"

      - name: Smoke-test completions output
        run: |
          bash bin/box completions bash > /tmp/box_bash.txt
          bash bin/box completions zsh  > /tmp/box_zsh.txt

          # Extract commands from _BOX_COMMANDS array in bin/box
          mapfile -t declared < <(
            grep -oP "(?<=_BOX_COMMANDS=\()[^)]*" bin/box \
              | tr ' ' '\n' | tr -d '()' | grep -v '^$'
          )

          # Verify every declared command appears in bash completions
          missing=()
          for cmd in "${declared[@]}"; do
            grep -q "$cmd" /tmp/box_bash.txt || missing+=("$cmd")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf "ERROR: commands missing from bash completions: %s\n" "${missing[*]}"
            exit 1
          fi

          # Verify every declared command appears in zsh completions
          missing=()
          for cmd in "${declared[@]}"; do
            grep -q "$cmd" /tmp/box_zsh.txt || missing+=("$cmd")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf "ERROR: commands missing from zsh completions: %s\n" "${missing[*]}"
            exit 1
          fi

      - name: Verify _BOX_COMMANDS matches case dispatch
        run: |
          # Extract commands from _BOX_COMMANDS array
          mapfile -t declared < <(
            grep -oP "(?<=_BOX_COMMANDS=\()[^)]*" bin/box \
              | tr ' ' '\n' | tr -d '()' | grep -v '^$'
          )

          # Extract commands from case dispatch block (lines matching word followed by )
          mapfile -t dispatched < <(
            awk '/^case "\$command" in/,/^esac/' bin/box \
              | grep -oP '^\s+\K[a-z][a-z0-9-]+(?=\))' \
              | grep -v '^-'
          )

          # Check every dispatched command is in _BOX_COMMANDS
          missing=()
          for cmd in "${dispatched[@]}"; do
            found=false
            for d in "${declared[@]}"; do
              [[ "$d" == "$cmd" ]] && found=true && break
            done
            $found || missing+=("$cmd")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf "ERROR: case dispatch has commands not in _BOX_COMMANDS: %s\n" "${missing[*]}"
            printf "Add them to _BOX_COMMANDS in bin/box\n"
            exit 1
          fi

          printf "OK: all dispatched commands present in _BOX_COMMANDS\n"

      - name: Verify documented box commands exist
        run: |
          # Catch doc drift: every `box <cmd>` invocation shown in the docs
          # (inline code and fenced blocks in markdown, quoted strings in
          # setup.sh) must be a real command in _BOX_COMMANDS. Only matches
          # where "box" sits at a command position (line start, after a
          # backtick, &&, ;, | or open paren) are considered, so prose like
          # "the box itself" is ignored.
          mapfile -t declared < <(
            grep -oP "(?<=_BOX_COMMANDS=\()[^)]*" bin/box \
              | tr ' ' '\n' | tr -d '()' | grep -v '^$'
          )
          mapfile -t refs < <(
            {
              grep -ohP '`[^`]*`' README.md AGENTS.md .agents/skills/*/SKILL.md || true
              awk '/^```/ { in_block = !in_block; next } in_block' README.md AGENTS.md .agents/skills/*/SKILL.md
              grep -oh '"[^"]*"' setup.sh || true
            } | grep -oP '(?:^|[`;|(]|&&)\s*box +\K[a-z][a-z-]*(?![[:alnum:]_/.-])' | sort -u
          )
          missing=()
          for ref in "${refs[@]}"; do
            found=false
            for d in "${declared[@]}"; do
              [[ "$d" == "$ref" ]] && found=true && break
            done
            $found || missing+=("$ref")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf "ERROR: docs reference unknown box commands: %s\n" "${missing[*]}"
            exit 1
          fi
          printf "OK: all %d documented box commands exist\n" "${#refs[@]}"

      - name: Shellcheck
        run: |
          # Error-level only: the CLI relies on intentional word-splitting
          # (unquoted $rflag/$podman_cmd, SC2086 = info) and the
          # `local x="$(...)"` idiom throughout (SC2155 = warning), both of
          # which are deliberate. --severity=error catches genuine bugs
          # (parse errors, definitely-wrong constructs) without false noise.
          # Tighten the threshold once those patterns carry inline disables.
          shellcheck --severity=error --shell=bash bin/box scripts/*.sh setup.sh .githooks/pre-push

      # --- Security regressions from the 2026-09-08 review -------------------
      # Both run read-only, in a job with no write token, and neither touches
      # the network or executes any candidate PKGBUILD.

      - name: "No Actions expressions inside run: blocks"
        run: python3 scripts/check-workflow-injection.py

      - name: AUR diff validator rejects the known attack shapes
        run: bash scripts/test-aur-validator.sh

      - name: AUR review trigger rejects untrusted requests
        run: python3 scripts/test-aur-review-trigger.py

  changes:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.meta.outputs.date_tag }}
      build_base: ${{ steps.result.outputs.build_base }}
      box_matrix: ${{ steps.result.outputs.box_matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        run: echo "date_tag=$(date -u +%Y-%m-%dT%H%M)" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'Containerfile.base'
              - 'scripts/**'
              - 'local-bin/**'
              - 'aur/**'
              # aur/ docs do reach the image -- Containerfile.base COPYs the whole
              # tree -- but it is deleted again before the final image, so a
              # docs-only edit rebuilds base and every box to produce something
              # functionally identical. Negation must come after 'aur/**'.
              - '!aur/*.md'
              # Same idea for scripts/ that never reach an image: Containerfile.base
              # COPYs only init-root/init-user/shell-init/shell-env and box-brief.md,
              # so the CI- and workstation-only scripts below cannot change any image.
              # Negations must come after 'scripts/**'. Note the asymmetry is
              # deliberate: a NEW script is not listed here, so it rebuilds -- wasteful
              # but safe. Omitting a COPYed script would instead leave images silently
              # stale, so never negate one that Containerfile.base copies.
              - '!scripts/compile-box-toml.py'
              - '!scripts/vendor-aur.sh'
              - '!scripts/validate-aur-diff.py'
              - '!scripts/test-aur-validator.sh'
              - '!scripts/trigger-aur-review.py'
              - '!scripts/test-aur-review-trigger.py'
              - '!scripts/check-workflow-injection.py'
              - '!scripts/check-workflow-yaml.py'
              - '!scripts/test-workflow-yaml.py'
            priv:
              - 'priv/**'
            work:
              - 'work/**'
            dev:
              - 'dev/**'

      # Values arrive through env:, never spliced into the script text. These
      # particular ones are booleans GitHub generates, so they are not an
      # injection risk today -- but scripts/check-workflow-injection.py enforces
      # the rule repo-wide, because the next `${{ }}` someone adds here might
      # not be. See the header of aur-bump.yml.
      - name: Compute build flags
        id: result
        env:
          FORCE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          FILTER_BASE: ${{ steps.filter.outputs.base }}
          FILTER_PRIV: ${{ steps.filter.outputs.priv }}
          FILTER_WORK: ${{ steps.filter.outputs.work }}
          FILTER_DEV: ${{ steps.filter.outputs.dev }}
        run: |
          force="$FORCE"
          base="$FILTER_BASE"
          priv="$FILTER_PRIV"
          work="$FILTER_WORK"
          dev="$FILTER_DEV"

          [[ "$force" == "true" ]] && base=true && priv=true && work=true && dev=true

          boxes=()
          [[ "$base" == "true" || "$priv" == "true" ]] && boxes+=('"priv"')
          [[ "$base" == "true" || "$work" == "true" ]] && boxes+=('"work"')
          [[ "$base" == "true" || "$dev" == "true" ]] && boxes+=('"dev"')

          echo "build_base=$base" >> "$GITHUB_OUTPUT"
          echo "box_matrix=[$(IFS=,; echo "${boxes[*]}")]" >> "$GITHUB_OUTPUT"

  build-base:
    # `lint` is a gate, not decoration: without it a failing lint could coexist
    # with newly published images (security review finding 6).
    needs: [lint, changes]
    if: needs.changes.outputs.build_base == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/box-base:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/box-base:${{ needs.changes.outputs.date_tag }}
          build-args: |
            BUILD_DATE=${{ needs.changes.outputs.date_tag }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build-boxes:
    needs: [lint, changes, build-base]
    if: always() && !failure() && !cancelled() && needs.changes.outputs.box_matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        box: ${{ fromJson(needs.changes.outputs.box_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.box }}/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/box-${{ matrix.box }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/box-${{ matrix.box }}:${{ needs.changes.outputs.date_tag }}
          build-args: |
            BUILD_DATE=${{ needs.changes.outputs.date_tag }}
            BUILD_SHA=${{ github.sha }}
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/box-base:${{ needs.changes.outputs.build_base == 'true' && needs.changes.outputs.date_tag || 'latest' }}
          cache-from: type=gha,scope=${{ matrix.box }}
          cache-to: type=gha,mode=max,scope=${{ matrix.box }}

  cleanup:
    needs: [build-base, build-boxes]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete image versions older than 14 days
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            // Auto-discover boxes by scanning for */box.toml (mirrors bin/box),
            // so adding or removing a box needs no edit here. Always include base.
            const boxes = fs.readdirSync('.', { withFileTypes: true })
              .filter(d => d.isDirectory() && fs.existsSync(`${d.name}/box.toml`))
              .map(d => `box-${d.name}`);
            const images = ['box-base', ...boxes];
            const keepDays = 14;
            const cutoff = new Date(Date.now() - keepDays * 86400000);

            for (const image of images) {
              let versions;
              try {
                // Paginate: the unpaginated call returns only the first 30
                // versions (all recent), so old versions were never examined
                // and nothing past the cutoff ever got deleted.
                versions = await github.paginate(
                  github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                  {
                    package_type: 'container',
                    package_name: image,
                    username: owner,
                    per_page: 100,
                  }
                );
              } catch (e) {
                console.log(`Skipping ${image}: ${e.message}`);
                continue;
              }

              for (const version of versions) {
                const updatedAt = new Date(version.updated_at);
                const tags = version.metadata?.container?.tags || [];
                if (updatedAt < cutoff && !tags.includes('latest')) {
                  console.log(`Deleting ${image} version ${version.id} (tags: ${tags.join(', ')})`);
                  try {
                    await github.rest.packages.deletePackageVersionForUser({
                      package_type: 'container',
                      package_name: image,
                      username: owner,
                      package_version_id: version.id,
                    });
                  } catch (e) {
                    console.log(`  Failed: ${e.message}`);
                  }
                }
              }
            }
